name: PRAIN Phase 1 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        prototype:
          - PRAIN_v1.1.9_Phase1_Reference_Prototype
          - PRAIN_Phase1_Prototype_v1.2.18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source hashes and baseline preservation
        run: python tools/verify_phase1_import.py
      - name: Run Phase 1 reference prototype tests
        working-directory: archive/${{ matrix.prototype }}
        run: python -W default -m unittest discover -s tests -v
      - name: Verify candidate release inventory
        if: matrix.prototype == 'PRAIN_Phase1_Prototype_v1.2.18'
        working-directory: archive/${{ matrix.prototype }}
        run: python tools/verify_release.py
